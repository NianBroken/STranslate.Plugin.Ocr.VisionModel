name: Public Plugin

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build release package
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        shell: pwsh
        run: dotnet build ".\$env:REPO_NAME\$env:REPO_NAME.csproj" --configuration Release --no-incremental --force --nologo

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" ".\.artifacts\Release\Plugins\STranslate.Plugin.Ocr.VisionModel\plugins\STranslate.Plugin.Ocr.VisionModel.spkg" --generate-notes --verify-tag
